#This file is a language file, here you can change all the messages for this language
#Most configurable messages in this file will work with player and server placeholders
#NOTE:
#In order to use any external placeholder you might need to install a
#placeholder api plugin/mod. For more information check the wiki (https://github.com/Picono435/PicoJobs/wiki/Placeholders)
#################################################################################
##
#General messages                                                              #
##
#################################################################################
#In this category you can change the general messages of the plugin
no-permission: "&cHey! Du har ikke tilladelse til at udføre denne kommando."
ignore-action: "&cHey! Vær ikke doven og gå til at tale med NPC."
choosed-job: "&aTillykke! Du valgte jobbet %jobplayer_job%&a."
accepted-work: "&aDu har accepteret arbejdet af %jobplayer_work%."
no-salary: "&cDu har ikke nok løn til at få! Gå venligst til arbejde ;("
got-salary: "&aGreat Work! Du har lige fået din %jobplayer_salary% løn!"
finished-work: "&aTillykke! Du har lige afsluttet dit arbejde. Brug /jobs for at få mere information om det."
need-level: "&cHey! Du skal gøre %a% værker for at udføre denne handling."
no-args: "&cHey! Brug venligst en gyldig syntaks."
my-salary: "&aDu har %jobplayer_salary%$ løn."
unknow-job: "&cDette job blev ikke fundet, benyt TAB KOMPLET for at få en liste over job."
#In cooldown messages you can use the placeholders: %cooldown_mtime% -> Minecraft Time // %cooldown_time% -> Real Life Time
salary-cooldown: "&cDu skal vente mere %cooldown_mtime% for at få din løn igen."
leave-cooldown: "&cDu skal vente mere %cooldown_mtime% før du forlader et job igen."
work-status: "&aHer er hvad du skal gøre: %jobplayer_work%"
admin-commands: |-
  &6Fuld liste over kommandoer:
  &e/jobsadmin help &6- &eSe disse beskeder
  &e/jobsadmin info <player> &6- &eHenter oplysningerne om en spiller
  &e/jobsadmin genindlæs &6- &eReload alle mulige konfigurationer.
  &e/jobsadmin opdatering &6- &eInstallerer en opdatering af plugin'et
  &e/jobsadmin om &6- &eGets information om serveren og plugin'et
  &e/jobsadmin sæt <salary | method | job> <player> <amount | job> &6- &eIndstiller løn/metode for en spiller
  &e/jobsadmin editor &6- &eCreates a web editor session
  &e/jobsadmin applyedits &6- &eAnvend redigeringer af en web editor session
  &e/jobsadmin debug &6- &eEnables the DEBUG mode of the plugin
member-commands: |-
  &6Fuld liste over kommandoer:
  &e/jobs help &6- &eSe disse meddelelser
  &e/jobs choose <job> &6- &eChooses your job
  &e/jobs work &6- &eSe status/Accepter dit arbejde
  &e/jobs salary &6- &eCheck your salary
  &e/jobs withdraw &6- &eWithdraw your salary
  &e/jobs leave &6- &eBlade jobbet tilbage
info-command: |-
  &6Spillerens status %player_name%
  &eLøn: %jobplayer_salary%
  &eArbejder: %jobplayer_working%
  &eArbejde: %jobplayer_work%
  &eJob: %jobplayer_job%
reload-command: "&aConfigurations, Jobs & Sprog blev genindlæst med succes."
player-not-found: "&cDen spiller er ikke online, angiv venligst en gyldig spiller."
unknow-error: "&cDer opstod en unknow fejl, tjek venligst konsollen for mere information."
left-job: "&cYou are now unemployed! Make sure to get a new job and start earning money again."
already-updated: "&cPlugin'et er allerede i den nyeste version, for mere information tjek vores WIKI."
update-started: "&aOpdateringen af plugin PicoJobs startede, vent venligst..."
updated-sucefully: "&aPlugin blev opdateret sucefuld, genstart venligst serveren for at afslutte opdateringen."
sucefully: "&aHandlingen blev foretaget sucefuldt."
invalid-arg: "&aThe argument sent is invalid. Please check the mispell. (Automatic Copy)"
