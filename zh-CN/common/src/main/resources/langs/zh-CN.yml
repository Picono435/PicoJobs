#This file is a language file, here you can change all the messages for this language
#Most configurable messages in this file will work with player and server placeholders
#NOTE:
#In order to use any external placeholder you might need to install a
#placeholder api plugin/mod. For more information check the wiki (https://github.com/Picono435/PicoJobs/wiki/Placeholders)
#################################################################################
##
#General messages                                                              #
##
#################################################################################
#In this category you can change the general messages of the plugin
no-permission: "&c嘿! 您没有执行该命令的权限。"
ignore-action: "&c嘿! 别偷懒，去与 NPC 交互。"
choosed-job: "恭喜您成功选择了职业 %jobplayer_job%&a。"
accepted-work: "&a你接取了 %jobplayer_work% 的工作。"
no-salary: "&c你的薪水完全不够！请去工作;("
got-salary: "&a干的不错！你刚刚得到你的薪水 %jobplayer_salary%！"
finished-work: "恭喜您刚刚完成了您的工作。使用 /jobs 指令可以查看详细信息。"
need-level: "&c嘿! 您需要先做完 %a% 工作才能进行这个行为。"
no-args: "&c嘿! 请使用一个有效的语法。"
my-salary: "&a你的薪水有：%jobplayer_salary%。"
unknow-job: "&c未知职业，请使用 TAB 补全指令以获得职业列表。"
#In cooldown messages you can use the placeholders: %cooldown_mtime% -> Minecraft Time // %cooldown_time% -> Real Life Time
salary-cooldown: "&c你还需要等待 %cooldown_mtime% 才能再次拿到你的薪水。"
leave-cooldown: "&c您需要等待更多 %cooldown_mtime% 才能再次离开作业。"
work-status: "&a这里是你需要去做的事情： %jobplayer_work%"
admin-commands: |-
  &6Full list of commands:
  &e/jobsadmin help &6- &eSee this messages
  &e/jobsadmin info <player> &6- &eGets the information about a player
  &e/jobsadmin reload &6- &eReload all the possible configurations.
  &e/jobsadmin update &6- &eInstalls a update of the plugin
  &e/jobsadmin about &6- &eGets informations about the server and the plugin
  &e/jobsadmin set <salary | method | job> <player> <amount | job> &6- &eSets the salary/method of a player
  &e/jobsadmin editor &6- &eCreates a web editor session
  &e/jobsadmin applyedits &6- &eApply the edits of a web editor session
  &e/jobsadmin debug &6- &eEnables the DEBUG mode of the plugin
member-commands: |-
  &6完整的指令列表：
  &e/jobs help &6- &e查看此列表
  &e/jobs choos <job> &6- &e选择你的任务
  &e/jobs work &6- &e查看你的工作状态，以及是否接受
  &e/jobs palay &6- &e查看你的薪水
  &e/jobs acresption &6- &e撤回你的薪水
  &e/jobs leave &6- &e从当前职业辞职
info-command: |-
  &6玩家状态 %player_name%
  &e薪水: %jobplayer_salary%
  &e是否处于工作状态: %jobplayer_working%
  &e工作: %jobplayer_work%
  &e职业: %jobplayer_job%
reload-command: "&a配置文件, 职业文件和语言文件重载成功。"
player-not-found: "&c该玩家不在线，请输入一个在线的玩家。"
unknow-error: "&c发生未知错误，请查看控制台以获得更多信息。"
left-job: "&c你现在失业了！请务必获得新的工作并重新开始赚钱。"
already-updated: "&c此插件已经是最新版本，要查看更多信息请检查我们的 WIKI。"
update-started: "&a插件PicoJobs的更新已开始，请稍后..."
updated-sucefully: "&a此插件已成功更新，请重启服务端以完成更新。"
sucefully: "&a该行为已成功进行。"
invalid-arg: "&a输入的参数无效，请仔细检查。"
