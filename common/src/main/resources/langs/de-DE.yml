#This file is a language file, here you can change all the messages for this language
#Most configurable messages in this file will work with player and server placeholders
#NOTE:
#In order to use any external placeholder you might need to install a
#placeholder api plugin/mod. For more information check the wiki (https://github.com/Picono435/PicoJobs/wiki/Placeholders)
#################################################################################
##
#General messages                                                              #
##
#################################################################################
#In this category you can change the general messages of the plugin
no-permission: "&cHey! Du hast keine Berechtigung, diesen Befehl auszuführen."
ignore-action: "&cHey! Sei nicht faul; sprech mit einen NPC!"
choosed-job: "&aHerzlichen Glückwunsch! Du hast den Beruf %jobplayer_job%&a gewählt."
accepted-work: "&aDu hast den Auftrag %jobplayer_work% angenommen."
no-salary: "&cSchade, du hast nicht genug Gehalt, um es dir auszuzahlen. Wir bitten dich zu arbeiten! ;("
got-salary: "&aGroßartig! Du hast ein Gehalt von %jobplayer_salary% erhalten!"
finished-work: "&aHerzlichen Glückwunsch! Du hast deinen Auftrag beendet. Nutze /jobs um mehr Infos zu erhalten."
need-level: "&cHey! Um das nutzen zu können, beende %a% deiner Aufträge!"
no-args: "&cHey! Bitte verwende eine gültige Syntax!"
my-salary: "&aDu hast ein Gehalt von %jobplayer_salary%$."
unknow-job: "&cDieser Beruf wurde nicht gefunden, bitte nutze TAB COMPLETE um eine Liste von Berufen zu erhalten."
#In cooldown messages you can use the placeholders: %cooldown_mtime% -> Minecraft Time // %cooldown_time% -> Real Life Time
salary-cooldown: "&cUm abermals ein Gehalt zu erhalten, habe noch %cooldown_mtime% Geduld."
leave-cooldown: "&cBevor du deinen Beruf kündigst, warte %cooldown_mtime%."
work-status: "&aDein momentaniger Auftrag ist: %jobplayer_work%"
admin-commands: |-
  &6Vollständige Liste der Befehle:
  &e/jobsadmin help &6- &eZeigt diese Meldung an
  &e/jobsadmin info <player> &6- &eRuft Informationen über einen Spieler ab
  &e/jobsadmin reload &6- &eLädt alle Konfigurationen neu
  &e/jobsadmin update &6- &eInstalliert ein Update des Plugins
  &e/jobsadmin about &6- &eRuft Informationen über das Plugin und den Server ab
  &e/jobsadmin set <salary | method | job> <player> <amount | job> &6- &eLegt Gehalt/Methode eines Spielers fest
  &e/jobsadmin editor &6- &eErstellt eine Web-Editor-Sitzung
  &e/jobsadmin applyedits &6- &eÜbernimmt die Änderungen der Web-Editor-Sitzung
member-commands: |-
  &6Vollständige Liste der Befehle:
  &e/jobs help &6- &eZeigt diese Meldung an
  &e/jobs choose <job> &6- &eWählen eines Berufs
  &e/jobs work &6- &eDein aktueller Berufsstatus/Annahme eines Berufs
  &e/jobs salary &6- &eÜberprüfung deines Gehaltesw
  &e/jobs withdraw &6- &eAbhebung eines Gehaltes
  &e/jobs leave &6- &eBeruf kündigen
info-command: |-
  &6Beruflicher Status des Spielers %player_name%
  &eGehalt: %jobplayer_salary%$
  &eArbeitet: %jobplayer_working%
  &eAuftrag: %jobplayer_work%
  &eBeruf: %jobplayer_job%
reload-command: "&aKonfigurationen, Berufe und die Sprache wurden erfolgreich neu geladen."
player-not-found: "&cDieser Spieler ist nicht online. Bitte gebe einen gültigen Spielernamen ein!"
unknow-error: "&cEin unbekannter Fehler ist aufgetreten, bitte überprüfe die Konsole für weitere Informationen."
left-job: "&cDu bist jetzt arbeitslos! Stelle sicher, dass du einen neuen Job bekommst und wieder Geld verdienst."
already-updated: "&cDas Plugin ist bereits in der neuesten Version, für weitere Informationen lesen Sie unsere WIKI."
update-started: "&aDie Aktualisierung des Plugins PicoJobs wurde gestartet, bitte warten..."
updated-sucefully: "&aDas Plugin wurde erfolgreich aktualisiert, bitte starte den Server neu, um die Aktualisierung abzuschließen."
sucefully: "&aDiese Aktion wurde erfolgreich durchgeführt."
invalid-arg: "&aDas gesendete Argument ist ungültig. Überprüfte bitte ob du das Richtige verwendest."
