work-status: "&aهنا ما عليك القيام به: %jobplayer_work%"
admin-commands: |-
  &6Full list of commands:
  &e/jobsadmin help &6- &eSee this messages
  &e/jobsadmin info <player> &6- &eGets the information about a player
  &e/jobsadmin reload &6- &eReload all the possible configurations.
  &e/jobsadmin update &6- &eInstalls a update of the plugin
  &e/jobsadmin about &6- &eGets informations about the server and the plugin
  &e/jobsadmin set <salary | method | job> <player> <amount | job> &6- &eSets the salary/method of a player
  &e/jobsadmin editor &6- &eCreates a web editor session
  &e/jobsadmin applyedits &6- &eApply the edits of a web editor session
  &e/jobsadmin debug &6- &eEnables the DEBUG mode of the plugin
member-commands: |-
  &6 قائمة الأوامر الكاملة:
  &e/jobhelp &6- &eعرض هذه الرسائل
  &e/jobs اختر <job> &6- &eChooses your job
  &e/job work&6- &eمشاهدة حالة/قبول عملك
  &e/وظائف مرتباتك &6- &eالتحقق من راتبك
  &e/jobs سحبت &6- &eWowP مرتباتك
  &e/jobs leave &6- &eLeaves of the work
info-command: |-
  &6 حالة اللاعب %player_name%
  &eSalary: %jobplayer_salary%
  &eيجري العمل: %jobplayer_working%
  &eWork: %jobplayer_work%
  &eJob: %jobplayer_job%
reload-command: "تم بنجاح إعادة تحميل &aConfigurations, Jobs & Language."
player-not-found: "&cهذا اللاعب غير متصل، الرجاء وضع لاعب صالح."
unknow-error: "&cحدث خطأ غير معروف، الرجاء التحقق من وحدة التحكم للحصول على مزيد من المعلومات."
left-job: "&cYou are now unemployed! Make sure to get a new job and start earning money again."
already-updated: "&cالبرنامج المساعد موجود بالفعل في أحدث إصدار، لمزيد من المعلومات تحقق من WIKI لدينا."
update-started: "&aبدأ تحديث البرنامج المساعد PicoJobs، الرجاء الانتظار..."
updated-sucefully: "&aتم تحديث الملحق بشكل دقيق، الرجاء إعادة تشغيل الخادم لإنهاء التحديث."
sucefully: "&aتم اتخاذ الإجراء بشكل مناسب."
invalid-arg: "&aالوسيطة المرسلة غير صالحة. الرجاء التحقق من الخطأ."
