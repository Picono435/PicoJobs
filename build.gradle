//TODO: Relocate slimJar

import org.apache.tools.ant.filters.*
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'java-library'
    id 'maven-publish'
    id 'net.nemerosa.versioning' version '3.1.0'
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'dev.architectury.loom' version '1.5-SNAPSHOT' apply false
    id 'signing'
}

sourceCompatibility = '17'
targetCompatibility = '17'

if (System.getenv("STABLE_BUILD") == '0') {
    rootProject.version = versioning.info.build + "-DEV"
} else {
    rootProject.version = "1.0-pre"
}

subprojects {
    apply plugin: 'com.github.johnrengelman.shadow'
    apply plugin: 'signing'
    apply plugin: 'base'

    repositories {
        maven {
            name = "PiconoDev Repository"
            url "https://repo.piconodev.com/repository/maven-snapshots"
        }
    }

    configurations {
        shadow
    }

    shadowJar {
        archiveBaseName.set(rootProject.archives_base_name)
        archiveVersion.set(rootProject.version)
        configurations = [project.configurations.shadow]
    }

    tasks.withType(ShadowJar).configureEach {
        relocate 'org.spongepowered.configurate', 'com.gmail.picono435.picojobs.libs.org.spongepowered.configurate'
        relocate 'com.google.common', 'com.gmail.picono435.picojobs.libs.com.google.common'
        relocate 'com.google.errorprone', 'com.gmail.picono435.picojobs.libs.com.google.errorprone'
        relocate 'com.google.gson', 'com.gmail.picono435.picojobs.libs.com.google.gson'
        relocate 'com.google.j2objc', 'com.gmail.picono435.picojobs.libs.com.google.j2objc'
        relocate 'com.google.thirdparty', 'com.gmail.picono435.picojobs.libs.com.google.thirdparty'
        relocate 'com.typesafe.config', 'com.gmail.picono435.picojobs.libs.com.typesafe.config'
        relocate 'io.github.slimjar', 'com.gmail.picono435.picojobs.libs.io.github.slimjar'
        relocate 'io.leangen.geantyref', 'com.gmail.picono435.picojobs.libs.io.github.geantyref'
        relocate 'javax.annotation', 'com.gmail.picono435.picojobs.libs.javax.annotation'
        relocate 'org.apache.commons', 'com.gmail.picono435.picojobs.libs.org.apache.commons'
        relocate 'org.apache.maven.artifact', 'com.gmail.picono435.picojobs.libs.org.apache.maven.artifact'
        relocate 'org.apache.maven.repository', 'com.gmail.picono435.picojobs.libs.org.apache.maven.repository'
        relocate 'org.checkerframework', 'com.gmail.picono435.picojobs.libs.org.checkerframework'
        relocate 'org.codehaus.plexus', 'com.gmail.picono435.picojobs.libs.org.codehaus.plexus'
        relocate 'org.yaml.snakeyaml', 'com.gmail.picono435.picojobs.libs.org.yaml.snakeyaml'
    }

    /*signing {
        useGpgCmd()
        sign configurations.shadow
    }*/
}

allprojects {
    apply plugin: 'java-library'
    apply plugin: 'signing'

    archivesBaseName = rootProject.archives_base_name
    version = rootProject.version
    group = rootProject.group
    description = rootProject.description

    task sourcesJar(type: Jar, dependsOn: classes) {
        archiveClassifier.set('sources')
        from sourceSets.main.allSource
    }

    artifacts {
        archives sourcesJar
    }

    processResources {
        filter ReplaceTokens, tokens: [
                "name": rootProject.property("name"),
                "version": rootProject.property("version"),
                "description": rootProject.property("description")
        ]
    }
}

configure([project(':common-mod'), project(':fabric'), project(':forge')]) {
    apply plugin: "architectury-plugin"
    apply plugin: "dev.architectury.loom"

    base {
        archivesName = rootProject.archives_base_name
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        withSourcesJar()
    }

    architectury {
        minecraft = rootProject.minecraft_version
    }

    tasks.withType(ShadowJar).configureEach {
        relocate 'com.github.benmanes.caffeine', 'com.gmail.picono435.picojobs.libs.com.github.benmanes.caffeine'
        relocate 'com.google.protobuf', 'com.gmail.picono435.picojobs.libs.com.google.protobuf'
        relocate 'google.protobuf', 'com.gmail.picono435.picojobs.libs.google.protobuf'
        relocate 'com.mongodb', 'com.gmail.picono435.picojobs.libs.com.mongodb'
        relocate 'com.mysql', 'com.gmail.picono435.picojobs.libs.com.mysql'
        relocate 'com.sun.jna', 'com.gmail.picono435.picojobs.libs.com.sun.jna'
        relocate 'com.zaxxer.hikari', 'com.gmail.picono435.picojobs.libs.com.zaxxer.hikari'
        relocate 'org.bson', 'com.gmail.picono435.picojobs.libs.org.bson'
        relocate 'org.h2', 'com.gmail.picono435.picojobs.libs.org.h2'
        relocate 'org.bson', 'com.gmail.picono435.picojobs.libs.org.bson'
        relocate 'org.mariadb.jdbc', 'com.gmail.picono435.picojobs.libs.org.mariadb.jdbc'
        relocate 'org.bson', 'com.gmail.picono435.picojobs.libs.org.bson'
        relocate 'org.sqlite', 'com.gmail.picono435.picojobs.libs.org.sqlite'
        relocate 'waffle', 'com.gmail.picono435.picojobs.libs.waffle'
        relocate 'org.bstats', 'com.gmail.picono435.picojobs.libs.org.bstats'

        dependencies {
            exclude(dependency('org.slf4j:slf4j-api'))
            exclude(dependency('dev.racci.slimjar:slimjar'))
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = project.group
            artifactId = 'picojobs'
            version = project.version
            from components.java

            pom {
                name = "PicoJobs"
                description = "An amazing plugin that allows you to create your own jobs for your players. The plugin is 100% configurable so you can change everything you see, it is also open-source if you want to take a look on how it's made."
                url = "https://github.com/Picono435/PicoJobs"
                licenses {
                    license {
                        name = "The MIT License"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }
                developers {
                    developer {
                        id = "picono435"
                        name = "Picono435"
                        email = "picono435@gmail.com"
                    }
                }
                scm {
                    connection = "https://github.com/Picono435/PicoJobs"
                    developerConnection = "https://github.com/Picono435/PicoJobs.git"
                    url = "https://github.com/Picono435/PicoJobs"
                }
            }
        }
    }
    repositories {
        maven {
            credentials {
                username System.getenv("REPO_USER")
                password System.getenv("REPO_PASSWORD")
            }

            url = 'https://repo.piconodev.com/repository/maven-releases/'
        }
    }
}