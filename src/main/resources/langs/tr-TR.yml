#################################################################################
#In this category you can change the general messages of the plugin
no-permission: "&cHey! Bu komutu yürütme izniniz yok."
ignore-action: "&cHey! Tembel olmayın ve NPC ile konuşun."
choosed-job: "&aTebrikler! &e%jobplayer_job% &amesleğini seçtin."
accepted-work: "&e%jobplayer_work% &aadlı oyuncunun işini kabul ettin."
no-salary: "&cAlmak için yeterli maaşın yok! Lütfen işe git ;("
got-salary: "&aHarika İş! Az önce &e%jobplayer_salary% &amaaşını aldın!"
finished-work: "&aTebrikler! Az önce işini bitirdin. /jobs yazarak bunun hakkında detaylı bilgi al."
need-level: "&cHey! Bunu yapabilmek için %a% iş yapman gerek."
no-args: "&cHey! Lütfen geçerli bir sözdizimi kullan."
my-salary: "&a%jobplayer_salary% TL maaşın var."
unknow-job: "&cBu mesleklerin bulunamadı, lütfen mesleklerin bir listesini almak için TAB TAMLAMASI kullan."
#In cooldown messages you can use the placeholders: %cooldown_mtime% -> Minecraft Time // %cooldown_time% -> Real Life Time
salary-cooldown: "&cMaaşını alabilmek için %cooldown_mtime% kadar beklemelisin"
leave-cooldown: "&cMaaşını alabilmek için %cooldown_mtime% kadar beklemelisin"
work-status: "&aİşte yapman gerekenler: %jobplayer_work%"
admin-commands: |-
  &6Full list of commands:
  &e/jobsadmin help &6- &eSee this messages
  &e/jobsadmin info <player> &6- &eGets the information about a player
  &e/jobsadmin reload &6- &eReload all the possible configurations.
  &e/jobsadmin update &6- &eInstalls a update of the plugin
  &e/jobsadmin about &6- &eGets informations about the server and the plugin
  &e/jobsadmin set <salary | method | job> <player> <amount | job> &6- &eSets the salary/method of a player
  &e/jobsadmin editor &6- &eCreates a web editor session
  &e/jobsadmin applyedits &6- &eApply the edits of a web editor session
  &e/jobsadmin debug &6- &eEnables the DEBUG mode of the plugin
member-commands: |-
  &6Komutların listesi:
  &e/jobs help &6- &eBu mesajı gör
  &e/jobs choose <iş> &6- &eişini seçer
  &e/jobs work &6- &eDurumunu gör / Çalışmanın kabul edilmesi
  &e/jobs salary &6- &eMaaşını kontrol et
  &e/jobs withdraw &6- &eMaaşını çek
  &e/jobs leave &6- &eİşten ayrıl
info-command: |-
  &6%player_name% Adlı oyuncunun durumu
  &eMaaşı: %jobplayer_salary%
  &eÇalışıyor Mu: %jobplayer_working%
  &eİş: %jobplayer_work%
  &eMeslek: %jobplayer_job%
reload-command: "&aYapılandırmalar, Meslek ve Dil başarıyla yeniden yüklendi."
player-not-found: "&cBu oyuncu çevrimiçi değil, lütfen geçerli bir oyuncu girin."
unknow-error: "&cBilinmeyen bir hata oluştu, daha fazla bilgi için lütfen konsolu kontrol edin."
left-job: "&cSen işsiz değilsin! Yeni bir iş seçmeni tavsiye ederim yoksa çok para kaybedersin."
already-updated: "&cEklenti zaten en son sürümde, daha fazla bilgi için WIKI'mızı kontrol edin."
update-started: "&aPicoJobs eklentisinin güncellemesi başladı, lütfen bekleyin..."
updated-sucefully: "&aEklenti yeterince güncellendi, lütfen güncellemeyi bitirmek için sunucuyu yeniden başlatın"
sucefully: "&aEylem başarılı bir şekilde yapıldı."
invalid-arg: "&aGönderilen argüman geçersiz. Lütfen yanlış yazımı kontrol edin."
